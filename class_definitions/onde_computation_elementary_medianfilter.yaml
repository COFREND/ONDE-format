onde_class: ONDE_COMPUTATION_ELEMENTARY_MEDIANFILTER
inherits: 
  - ONDE_COMPUTATION_ELEMENTARY
description: '
##Signal filtering with medians

a class to inform eddy current filtering with median filter
Low pass :
$$
Hi pass : 
$$

$$
'
fields:
  TYPE:
    full_name: ONDE_COMPUTATION_ELEMENTARY_MEDIANFILTER:TYPE
    required: true
    storage: dataset
    hdf5_type: STRING
    description: 'Type of filtering'
    dimensions: '[N_SENSOR<p>]'
    allowed_values: 'HIGH|LOW'
  POINTS:
    full_name: ONDE_COMPUTATION_ELEMENTARY_MEDIANFILTER:POINTS
    required: false
    storage: dataset
    hdf5_type: H5T_INTEGER
    description: 'The number of points on which median is calculated. If not present, supposed to be infinite (all the points)'
    dimensions: '[N_SENSOR<p>]'
  LOWCUT:
    full_name: ONDE_COMPUTATION_ELEMENTARY_MEDIANFILTER:LOWCUT
    required: false
    storage: dataset
    hdf5_type: H5T_COMPLEX or H5T_COMPOUND
    description: 'A number, in Hz which describe Hi cut frequency (@-6dB by default)'
    dimensions: '[N_SENSOR<p>]'
