onde_class: ONDE_PHASED_ARRAY_ESCAN
inherits:
- ONDE_PHASED_ARRAY_SETUP
description: |-
    #### EScan

    In this configuration consecutive subsets of elements are used in order to
    form a beam at a specific angle, thus forming a sweeping set of ultrasonic
    beams. [Figure 26](onde_phased_array_escan.md) illustrates an Escan for 4
    consecutive elements with a step of 3 elements on a 32 element linear
    transducer.

    ![EScan configuration](../images/media/escan_config.png "Figure 26")

    *[Figure 26](onde_phased_array_escan.md): EScan configuration*
fields:
  EMITTER_PROBE:
    full_name: ONDE_PHASED_ARRAY_ESCAN:EMITTER_PROBE
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_PROBE>
    short_description: "Reference to the emitting probe used in this setup."
    description: ''
    dimensions: '1'
  RECEIVING_PROBE:
    full_name: ONDE_PHASED_ARRAY_ESCAN:RECEIVING_PROBE
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_PROBE>
    short_description: "Reference to the receiving probe used in this setup."
    description: ''
    dimensions: '1'
  NUMBER_OF_ELEMENTS:
    full_name: ONDE_PHASED_ARRAY_ESCAN:NUMBER_OF_ELEMENTS
    required: true
    storage: attribute
    hdf5_type: H5T_INTEGER
    short_description: 'The number of consecutive elements used to form a beam.'
    description: ''
    dimensions: '1'
  STEP:
    full_name: ONDE_PHASED_ARRAY_ESCAN:STEP
    required: true
    storage: attribute
    hdf5_type: H5T_INTEGER
    short_description: 'The number of elements by which the subset is shifted for each successive beam.'
    description: ''
    dimensions: '1'
  SEQUENCE_ANGLE_MODE:
    full_name: ONDE_PHASED_ARRAY_ESCAN:SEQUENCE_ANGLE_MODE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: "Specifies the wave propagation mode used for the setup sequence, such as longitudinal (L) or transverse (T)."
    description: ''
    allowed_values: '"L"|"T"'
  ANGLE:
    full_name: ONDE_PHASED_ARRAY_ESCAN:ANGLE
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    short_description: 'The specific angle at which the beam is formed during the scan.'
    description: ''
    dimensions: '1'
