onde_class: ONDE_PHASED_ARRAY_SETUP
inherits: [ONDE_ULTRASONIC_SETUP]
description: |-
    ### Phased Array Setup

    Exhaustive actual electronic configurations is stored here through the TRANSMIT_LAW and RECEIVE_LAW fields
    
    #### Laws

    Each A-scan in a dataframe must be associated with both a transmit and a
    receive focal law through the RECEIVE_LAW and TRANSMIT_LAW datafields. These
    contain HDF5 references to the groups which provide the detailed description
    of each focal laws (the same structure is used for both transmit and receive
    focal laws).

    #### Dynamic laws

    In order to allow advanced setups with different laws defined for each
    acquisition position, the cardinality of the transmission and reception can
    be either a 1D-array (same laws applied for each dataframe) or 2D
    (differentiated laws).

    #### Type of inspection

    Derivations are made to cover most of the situations that are common in industrial inspections and represent
    a large share of the acquisition files produced in the industry. More of these setups can be added in future versions
    of the specification.
    If a derivation does not exist, the ONDE_PHASED_ARRAY_CUSTOM derivation should be used to express the intent.

fields:

  TRANSMIT_LAW:
    full_name: ONDE_PHASED_ARRAY_SETUP:TRANSMIT_LAW
    required: true
    storage: dataset
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_LAW>
    short_description: 'HDF5 reference to the transmit focal law group.'
    description: |-
      Each A-scan in a dataframe must be associated with both a transmit and a
      receive focal law through the datafields. These contain HDF5 references to
      the groups which provide the detailed description of each focal laws (the
      same structure is used for both transmit and receive focal
      laws).
    dimensions: '[N_Ascan<m>] or [N_U<m>, N_V<m>, N_Ascan<m>]'
  RECEIVE_LAW:
    full_name: ONDE_PHASED_ARRAY_SETUP:RECEIVE_LAW
    required: true
    storage: dataset
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_LAW>
    short_description: 'HDF5 reference to the receive focal law group.'
    description: |-
      Each A-scan in a dataframe must be associated with both a transmit and a
      receive focal law through the datafields. These contain HDF5 references to
      the groups which provide the detailed description of each focal laws (the
      same structure is used for both transmit and receive focal laws).
    dimensions: '[N_Ascan<m>] or [N_U<m>, N_V<m>, N_Ascan<m>]'
