onde_class: ONDE_PHASED_ARRAY_SETUP
inherits: [ONDE_SCENARIO]
accessories:
- ONDE_UT_PULSEECHO
- ONDE_UT_SEPARATE_RECIEVER
description: |-
    ### Ultrasonic phased array scenario base class

    This class is intended to be a base class for general phased array
    ultrasonic scenarios. It has two optional accessory classes which
    can be selected based on whether there is a single array
    transducer that acts as both transmitter and receiver
    (ONDE_UT_PULSEECHO) or separate phased arrays for transmitter and
    receiver (ONDE_UT_SEPARATE_RECEIVER). Scenarios that use more than
    two transducers, perform simultaneous, pulse echo and through
    transmission, etc should not specify either of these accessory
    classes and instead use separate fields for identifying
    transducers.

    #### Type of inspection

    This group has no vocation to be exhaustive in terms of electronic configurations (unlike the TRANSMIT_RECIEVER_OR_LAW block that
    permits any description and is fully generic). However, subclasses are expected to describe the scenario of the various possible phased array tests. In this version of
    the specification, standardized scenarios encompass only the most basic setups.  The propagation mode used for the settings is given
    in SEQUENCE_ANGLE_MODE.

    ```mermaid
    classDiagram
      phased_array_setup <|-- angle
      phased_array_setup <|-- sscan
      phased_array_setup <|-- escan
      phased_array_setup <|-- compound
      phased_array_setup <|-- fmc
      phased_array_setup <|-- pwi
    ```
fields:
  TYPE_TAGS:
    full_name: ONDE:TYPE_TAGS
    required: false
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: 'Phased array accessory classes'
    description: ''
    dimensions: '[*]'
    allowed_values: '["ONDE_UT_PULSEECHO", "ONDE_UT_SEPARATE_RECIEVER"]'

  SEQUENCE_ANGLE_MODE:
    full_name: ONDE_PHASED_ARRAY_SETUP:SEQUENCE_ANGLE_MODE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: "Specifies the wave propagation mode used for the setup sequence, such as longitudinal (L) or transverse (T)."
    description: ''
    allowed_values: '"L"|"T"'
