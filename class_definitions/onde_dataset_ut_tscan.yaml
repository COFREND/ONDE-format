onde_class: ONDE_DATASET_UT_TSCAN
inherits:
- ONDE_DATASET_UT
description: |-
    ### Tscan datasets

    #### General

    Even though the name (Tscans coming from TFM Scans) implicitly refers to the
    TFM reconstruction images, the block can apply to any reconstruction method
    producing data on a rectangular/parallelepiped grid that moves with the
    sensor (be it obtained by TFM, Adaptive TFM, PWI, Adaptive PWI, frequency
    reconstruction, or any variant of these methods).

    #### Underlying data

    The ELEMENTARY_CHANNELS_DATASET points to the Ascan dataset that was used to
    create the reconstruction. It is a mandatory attribute (the Ascan dataset
    structure can contain no data if the elementary channels were not recorded).

    #### 3D Zones

    The format allows for the description of 3D zones. Taking into account the
    dimension related to positions, this implies that the dimension of the data
    array depends on the zone dimension (3D array for 2D zones 4D array for 3D
    zones).

    #### Pixel ordering

    The pixels are stored in the (X,Y,Z) order (X being the outer loop, Z the
    inner loop in the array).

    #### Reconstruction zone description
    
    The reconstruction zone is described by the attributes of the RECONSTRUCTION_SETUP block.

fields:
  DATA:
    full_name: ONDE_DATASET:DATA
    short_description: Contains the reconstructed T-scan data values.
    required: true
    storage: A or D
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_ASCAN_DATASET> or H5T_INTEGER
    description: can be either an array or a reference to an array
    dimensions: 1 or [N_U<m>,N_V<m>,N_ROW<m>,N_COL<m>] or [N_U<m>,N_V<m>,NROW<m>,NCOL<m>,N_PLANE<m>]
  
  SOURCE_ASCAN_DATASET:
    full_name: ONDE_DATASET_UT_TSCAN:SOURCE_ASCAN_DATASET
    short_description: Points to the elementary channel A-scans dataset used for this reconstruction.
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_ASCAN_DATASET>
    description: |-
      reference to the elementary channels ascans that were used for the
      reconstruction
    dimensions: '1'

  RECONSTRUCTION_SETUP:
    full_name: ONDE_DATASET_UT_TSCAN:RECONSTRUCTION_SETUP
    short_description: Contains the reconstruction setup parameters. 
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_RECONSTRUCTION_SETUP>
    description: |-
      reference to the reconstruction setup block that describes the
      reconstruction zone and the reconstruction parameters
    dimensions: '1'

