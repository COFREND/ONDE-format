  MANUFACTURING_LIFT_OFF:
    full_name: ONDE_ET_SENSOR_GROUP_CYLINDRICAL:MANUFACTURING_LIFT_OFF
    required: false
    storage: dataset
    hdf5_type: H5T_FLOAT
    description: Lift off induced by the manufacturing process (in meters). Supposed to be radial.
    dimensions: '[SENSOR_NUMBER<p>]'