modality: ONDE_ET
description: "

  ### ONDE ET File

  
  This class specifies the ET file type and provides a place for including top level fields. It explicitly references all of the classes that are allowed in this file type.
allowed_classes:


  - ONDE_DATASET\n\n
    - ONDE_DATASET_ET\n\n
      - ONDE_DATASET_ET_CSCAN\n\n
      - ONDE_DATASET_ET_RAW\n\n
  - ONDE_DIMENSION\n\n
  - ONDE_SETUP\n\n
  - ONDE_SETUP_ET\n\n
  - ONDE_GEOMETRIC_SETUP\n\n
  - ONDE_COMPONENT\n\n
  - ONDE_PLANE\n\n
  - ONDE_CYLINDER\n\n
  - ONDE_2DCAD\n\n
  - ONDE_3DCAD\n\n
  - ONDE_WELD\n\n
  - ONDE_ET_PROBE\n\n
    - ONDE_ET_PROBE_PLANE\n\n
    - ONDE_ET_PROBE_TUBE\n\n
  - ONDE_ACQUISITION_TRAJECTORY\n\n
    - ONDE_SPATIAL_TRAJECTORY\n\n
      - ONDE_ACQUISITION_GRID\n\n
    - ONDE_TIME_TRAJECTORY\n\n"

fields:
  FILETYPE:
    full_name: ONDE:FILETYPE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: For detailed information, see https://github.com/COFREND/ONDE-format/blob/main/ET_specification/ET_file_format.md
    dimensions: '1'
    allowed_values: '"ONDE_ET"'
  VERSION:
    full_name: ONDE:VERSION
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: ''
    dimensions: '1'
    allowed_values: '"0.9.0"'
