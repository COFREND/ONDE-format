modality: ONDE_ET
description: |

  ### ONDE ET File

  
  This class specifies the ET file type and provides a place for including top level fields. It explicitly references 
  all of the classes that are allowed in this file type.

allowed_classes:
  - ONDE_DATASET
  - ONDE_DATASET_ET
  - ONDE_DATASET_ET_CSCAN
  - ONDE_DATASET_ET_RAW
  - ONDE_DIMENSION
  - ONDE_SETUP
  - ONDE_GEOMETRIC_SETUP
  - ONDE_COMPONENT
  - ONDE_PLANE
  - ONDE_CYLINDER
  - ONDE_2DCAD
  - ONDE_3DCAD
  - ONDE_WELD
  - ONDE_ACQUISITION_TRAJECTORY
  - ONDE_SPATIAL_TRAJECTORY
  - ONDE_ACQUISITION_GRID
  - ONDE_TIME_TRAJECTORY
  - ONDE_SETUP_ET
  - ONDE_PROBE
  - ONDE_ET_PROBE
  - ONDE_ET_PROBE_PLANE
  - ONDE_ET_PROBE_TUBE
  - ONDE_ET_SENSOR_GROUP
  - ONDE_PROCESS
  - ONDE_PROCESS_FILTER
  - ONDE_PROCESS_MEDIANFILTER
  - ONDE_PROCESS_STANDARDISATION

fields:
  FILETYPE:
    full_name: ONDE:FILETYPE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: For detailed information, see https://github.com/COFREND/ONDE-format/blob/main/ET_specification/ET_file_format.md
    dimensions: '1'
    allowed_values: '"ONDE_ET"'
  VERSION:
    full_name: ONDE:VERSION
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: ''
    dimensions: '1'
    allowed_values: '"0.9.1"'
