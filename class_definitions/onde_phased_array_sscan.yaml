onde_class: ONDE_PHASED_ARRAY_SSCAN
inherits:
- ONDE_PHASED_ARRAY_SETUP
description: |-
    #### SScan

    In this configuration (see [Figure 25](onde_phased_array_sscan.md)), the
    probe is configured to emit/receive at a set of angles. The angles are
    linearly varying, therefore the first and last angles and the number of
    shots define the set of angles.

    ![SScan configuration](../images/media/sscan_config.png "Figure 25")

    *[Figure 25](onde_phased_array_sscan.md): SScan configuration*
fields:
  EMITTER_PROBE:
    full_name: ONDE_PHASED_ARRAY_SSCAN:EMITTER_PROBE
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_PROBE>
    short_description: "Reference to the emitting probe used in this setup."
    description: ''
    dimensions: '1'
  RECEIVING_PROBE:
    full_name: ONDE_PHASED_ARRAY_SSCAN:RECEIVING_PROBE
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_PROBE>
    short_description: "Reference to the receiving probe used in this setup."
    description: ''
    dimensions: '1'
  SEQUENCE_ANGLE_MODE:
    full_name: ONDE_PHASED_ARRAY_SSCAN:SEQUENCE_ANGLE_MODE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: "Specifies the wave propagation mode used for the setup sequence, such as longitudinal (L) or transverse (T)."
    description: ''
    allowed_values: '"L"|"T"'
  STARTING_ANGLE:
    full_name: ONDE_PHASED_ARRAY_SSCAN:STARTING_ANGLE
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    short_description: "The first emission or reception angle in the linearly varying set for the SScan."
    description: ''
    dimensions: '1'
  FINISHING_ANGLE:
    full_name: ONDE_PHASED_ARRAY_SSCAN:FINISHING_ANGLE
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    short_description: "The final emission or reception angle in the linearly varying set for the SScan."
    description: ''
    dimensions: '1'
  NUMBER_OF_ANGLES:
    full_name: ONDE_PHASED_ARRAY_SSCAN:NUMBER_OF_ANGLES
    required: true
    storage: attribute
    hdf5_type: H5T_INTEGER
    short_description: "The total number of shots or linearly varying angles defining the set for the SScan."
    description: ''
    dimensions: '1'
