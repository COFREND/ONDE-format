onde_class: ONDE_PHASED_ARRAY_ANGLE
inherits:
- ONDE_PHASED_ARRAY_SETUP
description: |-
    #### Angle

    In this configuration (see [Figure 24](onde_phased_array_angle.md)), a single angle is provided for the specification of the ultrasonic ray direction.

    ![Inspection using a single angle](../images/media/single_angle_inspection.png "Figure 24")

    *[Figure 24](onde_phased_array_angle.md): Inspection using a single angle*
fields:
  EMITTER_PROBE:
    full_name: ONDE_PHASED_ARRAY_ANGLE:EMITTER_PROBE
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_PROBE>
    short_description: "Reference to the emitting probe used in this setup."
    description: ''
    dimensions: '1'
  RECEIVING_PROBE:
    full_name: ONDE_PHASED_ARRAY_ANGLE:RECEIVING_PROBE
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_UT_PROBE>
    short_description: "Reference to the receiving probe used in this setup."
    description: ''
    dimensions: '1'
  SEQUENCE_ANGLE_MODE:
    full_name: ONDE_PHASED_ARRAY_ANGLE:SEQUENCE_ANGLE_MODE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: "Specifies the wave propagation mode used for the setup sequence, such as longitudinal (L) or transverse (T)."
    description: ''
    allowed_values: '"L"|"T"'
  BSCAN_ANGLE:
    full_name: ONDE_PHASED_ARRAY_ANGLE:BSCAN_ANGLE
    short_description: "The specified angle for the ultrasonic ray direction."
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    dimensions: '1'
