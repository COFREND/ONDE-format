onde_class: ONDE_FREE_TRAJECTORY
inherits:
- ONDE_SPATIAL_TRAJECTORY
description: |-
    
    #### Free trajectory

    The free trajectory is a spatial trajectory that is not constrained to a grid. 
    It can be used to define an acquisition frame at the surface of the specimen, 
    describing the coder values  at each acquisition point, allowing for complex scanning patterns and movements.

    #### UV definition

    The origin and the orientation of the encoding system are provided in (x,y) coordinates in the case of a plane specimen, in (x,
    theta) coordinates in the case of a cylinder specimen, theta being the radial direction on the unfolded surface. 
    They are expressed as a 2D transform from the surface component
    frame in UV_GRID_FRAME. For cylindrical components, it is necessary to specify if the inner or the outer surface is
    concerned, which is achieved by setting GRID_CYLINDER_DEFINITION to INNER or OUTER.

    This surface component frame is the 2D projection of the component frame on the considered surface (along z for plane
    specimens, along r for cylinder specimens).


fields:
  REFERENCE_SPECIMEN:
    full_name: ONDE_FREE_TRAJECTORY:REFERENCE_SPECIMEN
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_COMPONENT>
    short_description: The reference specimen associated with the acquisition grid.
    description: When defining an acquisition grid, it is necessary to define a reference
      specimen that is either a cylinder or a plane.
    dimensions: '1'
  CYLINDER_DEFINITION:
    full_name: ONDE_FREE_TRAJECTORY:CYLINDER_DEFINITION
    required: false
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: Specifies whether the grid is on the inner or outer surface.
    description: Defines whether the grid is expressed in the inner surface of the
      cylinder or on the outer surface
    allowed_values: '"INNER"|"OUTER"'
  UV_GRID_FRAME:
    full_name: ONDE_FREE_TRAJECTORY:UV_GRID_FRAME
    required: false
    storage: attribute
    hdf5_type: H5T_FLOAT
    short_description: The 2D coordinate frame defining the encoding directions on the surface.
    description: 2D Frame defining the U_GRID and V_GRID directions of the encoding
      in the surface representation of the specimen (X,Y) for planar specimens, (X,THETA)
      for cylindrical specimens. (1,0,) is assumed if missing
    dimensions: '[3]'
  U_ENCODER:
    full_name: ONDE_FREE_TRAJECTORY:U_ENCODER
    required: true
    storage: dataset
    hdf5_type: H5T_FLOAT
    short_description: The actual measured encoder values along the U axis.
    description: Obtained encoder values on the u axis
    dimensions: '[N_U<m>]'
  V_ENCODER:
    full_name: ONDE_FREE_TRAJECTORY:V_ENCODER
    required: false
    storage: dataset
    hdf5_type: H5T_FLOAT
    short_description: The actual measured encoder values along the V axis.
    description: Obtained encoder values on the v axis
    dimensions: '[N_U<m>]'
  PROBE_DIRECTION:
    full_name: ONDE_FREE_TRAJECTORY:PROBE_DIRECTION
    required: false
    storage: dataset
    hdf5_type: H5T_FLOAT
    short_description: The orientation of the probe within the grid's local coordinate system.
    description: |-
      For grid data, direction of the probe in the (u, v, w) coordinate system.
      Defaults to identity matrix.
    dimensions: '[3,3]'
