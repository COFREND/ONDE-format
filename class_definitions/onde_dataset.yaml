onde_class: ONDE_DATASET
inherits: []
description: |
  ## Explanatory notes

  ### Generic remarks on datasets

  The DATE_AND_TIME and OPERATOR fields allow to give indication on the context of the acquisition. 

  ### Notes on groups

    The following links provide explanatory notes for the ONDE groups that are described in the [YAML schemas](https://github.com/COFREND/ONDE-format/tree/main/class_definitions).

  [Ascan datasets](onde_dataset_ut_ascan.md)

  [Tscan datasets](onde_dataset_ut_tscan.md)

  [Cscan datasets](onde_dataset_ut_cscan.md)

  [Setup](onde_setup.md)

  [Geometric setup](onde_geometric_setup.md)

  [Components](onde_component.md)

  [Probes](onde_ut_probe.md)

  [Trajectory](onde_acquisition_trajectory.md)

  [Ultrasonic setup](onde_ultrasonic_setup.md)

  [Electronic Law](onde_ut_law.md)

  [Phased array setup](onde_phased_array_setup.md)
fields:
  LABEL:
    full_name: ONDE:LABEL
    required: false
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: A name or label representing this dataset.
    description: A name for this dataset
    dimensions: '1'
  UUID:
    full_name: ONDE:UUID
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: |
      The UUID field is a mandatory  universally unique identifier. This field is intended to uniquely identify this dataset among all others that have ever been created or ever will be created, even those with exactly the same content. This field is stored as a string.

      For compatibility with future improvements to the specification, readers should treat the strings as opaque sequences of characters. Readers should  be able to accommodate strings of up to 512 characters and  consisting of the following ASCII characters: 0-9, a-z, A-Z, and the following 19 symbols: ";/?:@&=+$,-_.!~*'()" (not including the double quote).

      This version of the ONDE specification defines a single format for the UUID based on ISO/IEC 9834-8/ITU X.667. The UUID should consist of the string "urn:uuid:" followed by the hexadecimal representation of a 128 bit unique identifier. The hexadecimal representation should use only lower case letters, and there should be dashes ("-") after the 8th, 12th, 16th, and  20th hexadecimal digits. For example, "urn:uuid:01234567-89ab-cdef-0123-456789abcdef".

      The recommended procedure for generating the 128 bit identifier is to follow [ISO/IEC 9834-8/ITU X.667](https://www.itu.int/rec/T-REC-X.667-201210-I/en), however any procedure (such as applying a cryptographic hash to unique information such as equipment serial number combined with time) that can guarantee an infintesmial probability of multiple datasets being given the same UUID is sufficient.
      
    dimensions: '1'
  SETUP:
    full_name: ONDE_DATASET:SETUP
    required: true
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_SETUP>
    short_description: Reference to the setup configuration used for this dataset.
    description: ''
    dimensions: '1'
  OPERATOR:
    full_name: ONDE_DATASET:OPERATOR
    required: false
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: The name or identifier of the operator conducting the acquisition.
    description: ''
    dimensions: '1'
  DATE_AND_TIME:
    full_name: ONDE_DATASET:DATE_AND_TIME
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: |-
      The ISO 8601 extended format: 'yyyy-mm-ddTHH:MM:SS' (e.g. '2019-01-16T17:05:06') must be used with a capital T separating the date and the time. Optionally, a decimal point ('.') and a fractional portion of a second may be appended. In addition, time zone information is usually appended:
      * "Z", indicating a timestamp in UTC
      * "±hh:mm", indicating a timezone with the specified offset from UTC
      * (no timezone information), indicating an unknown timezone; software will usually interpret this as local time or UTC. 
    dimensions: '1'
  DATA:
    full_name: ONDE_DATASET:DATA
    required: false
    storage: A or D
    hdf5_type: H5T_STD_REF_OBJ<data> or H5T_INTEGER or H5T_FLOAT
    short_description: The core data array or a reference to the array.
    description: |-
      Data can be either an array or a reference to an array. Omitting this
      field is possible, in the event when Tscan or Cscan data is recorded but
      the underlying Ascan data is not. The dimensions of the dataset are
      application dependent, subclasses can override and specify the dimensions.
  AMPLITUDE_DIMENSION:
    full_name: ONDE_DATASET:AMPLITUDE_DIMENSION
    required: false
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_DIMENSION>
    short_description: Reference to the dimension defining the amplitude characteristics.
    description: |-
      If absent, treated as coordinate "Amplitude", units "Arbitrary", offset
      0.0, scale 1.0
    dimensions: '1'
  INDEX_DIMENSIONS:
    full_name: ONDE_DATASET:INDEX_DIMENSIONS
    required: false
    storage: attribute
    hdf5_type: H5T_STD_REF_OBJ<ONDE_DIMENSION>
    short_description: Array of references to the index dimensions of the dataset.
    description: |-
      One entry per dimension of ONDE_DATASET:DATA. Any that are absent are
      treated as coordinate "Time", units "seconds", offset 0.0, scale 1.0
    dimensions: '[n_data_dims]'
  MIN:
    full_name: ONDE_DATASET:MIN
    required: true
    storage: attribute
    hdf5_type: H5T_INT
    short_description: 'The minimum possible value for the ONDE_DATASET.'
    description: |-
      This value represents the minimum possible value for the dataset used 
      within the acquistion.     
    dimensions: '1'
  MAX:
    full_name: ONDE_DATASET:MAX
    required: true
    storage: attribute
    hdf5_type: H5T_INT
    short_description: 'The maximum possible value for the ONDE_DATASET.'
    description: |-
      This value represents the maximum possible value for the dataset used 
      within the acquistion.     
    dimensions: '1'
  UNIT_MIN:
    full_name: ONDE_DATASET:UNIT_MIN
    required: true
    storage: attribute
    hdf5_type: H5T_INT
    short_description: 'Minimum Possible value for the dataset in the corresponding unit.'
    description: |-
      This value represents the minimum possible value for the dataset in the corresponding unit 
      within the acquistion.     
    dimensions: '1'
UNIT_MAX:
    full_name: ONDE_DATASET:UNIT_MIN
    required: true
    storage: attribute
    hdf5_type: H5T_INT
    short_description: 'Maximum Possible value for the dataset in the corresponding unit.'
    description: |-
      This value represents the maximum possible value for the dataset in the corresponding unit 
      within the acquistion.     
    dimensions: '1'
UNIT_TYPE:
    full_name: ONDE_DATASET:UNIT_TYPE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    short_description: 'The units of the dataset collected in the acquisition.'
    description: |-
      This represents the units used within the dataset  value for the dataset in the corresponding unit 
      within the acquistion. UNIT_TYPE could contain strings such as "Percent", "Seconds", etc.     
    dimensions: '1'