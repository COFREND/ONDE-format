onde_class: ONDE_WELD
inherits:
- ONDE_COMPONENT
description: ''
fields:
  EXTRUSION_TYPE:
    full_name: ONDE_WELD:EXTRUSION_TYPE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: |
      'This field specifies the type of extrusion for the weld geometry, which can be either a plane or a cylindrical shape.
      The extrusion type determines how the weld is represented in 3D space and affects the interpretation of the component dimensions.'
    short_description: 'Specifies the type of extrusion for the weld geometry.'
    dimensions: '1'
    allowed_values: '"PLANE"|"CIRCUMFERENTIAL_CYLINDRICAL"|"AXIAL_CYLINDRICAL"'
  COMPONENT_DIMENSIONS:
    full_name: ONDE_WELD:COMPONENT_DIMENSIONS
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: |
      The physical dimensions of the welded component, represented as a 2D array. 
      For a plane extrusion, the dimensions are given as (width, length), the length being the dimension along the weld axis. 
      For a cylindrical extrusion, either circumferential or axial, the dimensions of the component are given as (outer diameter, length).
      By convention, the welds are located at the exact center of the component.
      The thickness of the component is not specified in this field, as it is assumed to be the same as the weld thickness.
      It is obtained by adding the heights of the weld passes (fill, hot pass, land, root) together.
    short_description: 'The physical dimensions of the welded component'
    dimensions: '[2]'
  WELD_TYPE:
    full_name: ONDE_WELD:WELD_TYPE
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: ''
    short_description: 'Specifies the shape type of the weld groove (e.g., V or U).'
    dimensions: '1'
    allowed_values: '"V"|"U"'
  WELD_SYMMETRY:
    full_name: ONDE_WELD:WELD_SYMMETRY
    required: true
    storage: attribute
    hdf5_type: H5T_STRING
    description: ''
    short_description: 'Describes the symmetry configuration of the weld geometry.'
    dimensions: '1'
    allowed_values: '"SYMMETRIC"|"STRAIGHT_LEFT"|"STRAIGHT_RIGHT"'
  WELD_UPPER_CAP_WIDTH:
    full_name: ONDE_WELD:WELD_UPPER_CAP_WIDTH
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The width of the upper cap of the weld.'
    dimensions: '1'
  WELD_UPPER_CAP_HEIGHT:
    full_name: ONDE_WELD:WELD_UPPER_CAP_HEIGHT
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The height of the upper cap of the weld.'
    dimensions: '1'
  WELD_FILL_ANGLE:
    full_name: ONDE_WELD:WELD_FILL_ANGLE
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The angle of the fill pass for the weld.'
    dimensions: '1'
  WELD_FILL_HEIGHT:
    full_name: ONDE_WELD:WELD_FILL_HEIGHT
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The height of the fill pass for the weld.'
    dimensions: '1'
  WELD_HOT_PASS_ANGLE:
    full_name: ONDE_WELD:WELD_HOT_PASS_ANGLE
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The angle of the hot pass layer in the weld.'
    dimensions: '1'
  WELD_HOT_PASS_HEIGHT:
    full_name: ONDE_WELD:WELD_HOT_PASS_HEIGHT
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The height of the hot pass layer in the weld.'
    dimensions: '1'
  WELD_LAND_OFFSET:
    full_name: ONDE_WELD:WELD_LAND_OFFSET
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The offset measurement for the root land of the weld.'
    dimensions: '1'
  WELD_LAND_HEIGHT:
    full_name: ONDE_WELD:WELD_LAND_HEIGHT
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The height of the root land of the weld.'
    dimensions: '1'
  WELD_ROOT_ANGLE:
    full_name: ONDE_WELD:WELD_ROOT_ANGLE
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The angle of the root pass for the weld.'
    dimensions: '1'
  WELD_ROOT_HEIGHT:
    full_name: ONDE_WELD:WELD_ROOT_HEIGHT
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The height of the root pass for the weld.'
    dimensions: '1'
  WELD_LOWER_CAP_HEIGHT:
    full_name: ONDE_WELD:WELD_LOWER_CAP_HEIGHT
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
    description: ''
    short_description: 'The height of the lower cap of the weld.'
    dimensions: '1'
  WELD_LOWER_CAP_WIDTH:
    full_name: ONDE_WELD:WELD_LOWER_CAP_WIDTH
    required: true
    storage: attribute
    hdf5_type: H5T_FLOAT
